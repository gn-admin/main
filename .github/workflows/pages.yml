name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prerender fichas y sitemap
        env:
          SITE_URL: https://gn-admin.github.io/main
        run: node scripts/prerender.js --site-url "$SITE_URL"
      - name: Check links
        run: node scripts/check-links.js .
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines
        run: |
          curl -sS -o /dev/null "https://www.google.com/ping?sitemap=https://gn-admin.github.io/main/sitemap.xml" || true
          curl -sS -o /dev/null "https://www.bing.com/ping?sitemap=https://gn-admin.github.io/main/sitemap.xml" || true
